services:
  postgres:
    image: postgres:16-alpine
    container_name: chainsure-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chainsure_dev
    ports:
      - "5432:5432"
    volumes:
      # Persist data between container restarts
      - postgres_data:/var/lib/postgresql/data
      # Optional: initialization scripts
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U user -d chainsure_dev || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for database management (GUI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: chainsure-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@chainsure.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
